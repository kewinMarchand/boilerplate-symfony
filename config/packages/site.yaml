parameters:
    # Renseigner après un audit RGAA : le lien du pied de page en déduit l'état de conformité (le texte de la déclaration est dans l'admin de l'API).
    site.accessibility:
        audit_date: null
        compliance_rate: null
        auditor: null
    site:
        name: Boilerplate Symfony
        description: Boilerplate Symfony avec Twig, Stimulus et Turbo, rendu serveur, outillé pour la QA, les tests end-to-end et l’accessibilité.
        url: '%env(SITE_URL)%'
        theme_color: '#1d4ed8'
        navigation:
            main:
                - { route: home, label: nav.home }
                - { route: catalog, label: nav.catalog }
                - { route: blog, label: nav.blog }
                - { route: tasks, label: nav.tasks }
                - { route: contact, label: nav.contact }
            legal:
                - { route: legal_notice, label: nav.legal_notice }
                - { route: legal_privacy, label: nav.legal_privacy }
                - { route: legal_accessibility, label: nav.legal_accessibility }
                - { route: legal_sitemap, label: nav.legal_sitemap }

twig:
    globals:
        site: '%site%'
