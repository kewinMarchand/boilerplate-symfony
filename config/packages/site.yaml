parameters:
    # Renseigner après un audit RGAA : le lien du pied de page en déduit l'état de conformité (le texte de la déclaration est dans l'admin de l'API).
    site.accessibility:
        audit_date: null
        compliance_rate: null
        auditor: null
    site:
        name: Boilerplate Symfony
        description: Boilerplate Symfony avec Twig, Stimulus et Turbo, rendu serveur, outillé pour la QA, les tests end-to-end et l’accessibilité.
        url: '%env(SITE_URL)%'
        locale: fr_FR
        theme_color: '#1d4ed8'
        navigation:
            main:
                - { route: home, label: Accueil }
                - { route: catalog, label: Catalogue }
                - { route: blog, label: Blog }
                - { route: tasks, label: Tâches }
                - { route: contact, label: Contact }
            legal:
                - { route: legal_notice, label: Mentions légales }
                - { route: legal_privacy, label: Données personnelles }
                - { route: legal_accessibility, label: Accessibilité }
                - { route: legal_sitemap, label: Plan du site }

twig:
    globals:
        site: '%site%'
