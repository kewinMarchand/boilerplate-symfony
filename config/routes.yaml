# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

controllers:
    resource: routing.controllers

# Les mêmes routes sous le préfixe d'une langue autre que la langue par défaut (/en/produit/…, section 29 bis de la spec
# commune). Les langues viennent de l'API : l'exigence ne vérifie que la forme, App\Shared\UI\Locale\LocaleSubscriber
# répond 404 à un préfixe qui n'est pas une langue activée autre que la langue par défaut.
controllers_localized:
    resource: routing.controllers
    prefix: /{_locale}
    name_prefix: localized_
    requirements:
        _locale: '[a-z]{2}'
    trailing_slash_on_root: false

csp_report:
    path: /api/csp-report
    controller: Kewinmarchand\Csp\Symfony\CspReportController
    methods: [POST]
