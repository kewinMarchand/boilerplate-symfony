# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/*/Domain/'
            - '../src/Kernel.php'

    App\Task\Domain\TaskRepository: '@App\Task\Infrastructure\Http\HttpTaskRepository'
    App\Blog\Domain\ArticleRepository: '@App\Blog\Infrastructure\Http\HttpArticleRepository'
    App\Content\Domain\LegalPageRepository: '@App\Content\Infrastructure\Http\HttpLegalPageRepository'
    App\Contact\Domain\ContactMessageSender: '@App\Contact\Infrastructure\Http\HttpContactMessageSender'
    App\Catalog\Domain\CatalogRepository: '@App\Catalog\Infrastructure\Http\HttpCatalogRepository'
    App\Shared\Domain\SiteIdentityRepository: '@App\Shared\Infrastructure\Http\HttpSiteIdentityRepository'
    App\Shared\Domain\PageMetaRepository: '@App\Shared\Infrastructure\Http\HttpPageMetaRepository'

    Kewinmarchand\Csp\Symfony\CspResponseSubscriber:
        factory: ['App\Shared\Infrastructure\Security\SiteCsp', 'subscriber']
        arguments: ['%env(API_URL)%', '%env(MATOMO_URL)%', '%env(GLITCHTIP_DSN)%']

    Kewinmarchand\Csp\Symfony\CspReportController:
        tags: ['controller.service_arguments']

when@test:
    services:
        logger:
            class: Psr\Log\NullLogger
        App\Tests\Support\ApiMockResponseFactory: ~
